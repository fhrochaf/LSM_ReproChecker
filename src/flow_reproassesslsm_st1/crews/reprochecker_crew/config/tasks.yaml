filter_landslide_mapping_paper:
  description: >
    Based only on the abstract provided below, determine whether this paper
    explores and documents a landslide detection/mapping method. A qualifying paper's
    abstract must indicate a methodology (or a reference
    to prior methodology) to detect/map landslides, a description of the datasets used, and a
    description of the results. Exclude papers that only describe landslide
    inventories, landslide susceptibility mapping methods, or that are
    review articles. Do not assume details the abstract doesn't state; if
    ambiguous, lean toward EXCLUDE and say why in the reason.

    Abstract:
    {abstract}
  expected_output: >
    Return only the structured fields, no explanatory prose beyond the required short text fields.
    A decision of either INCLUDE or EXCLUDE, followed by justification:
    - If INCLUDE: briefly state what mapping method is being used and with which datasets.
    - If EXCLUDE: state the reason, e.g. "landslide inventory only",
      "susceptibility mapping, not mapping method", "review article",
      or "missing methodology/dataset/results description".
    The output should be around 50 words.
  agent: abstract_screener

check_data_reproducibility:
  description: >
    Step 1 — Catalog: scan the full paper (methods, results, figures, tables,
    captions) and list every distinct dataset used for landslide mapping,
    including satellite imagery and landslide inventories. Use the actual
    dataset name as given (e.g. 'Landslide Inventory of Region X',
    'Sentinel-2 imagery'), never a generic category.

    Step 2 — Availability sweep: independently search the ENTIRE paper for
    retrieval links and access statements — including dedicated sections like
    "Data Availability", "Data and Resources", footnotes, acknowledgments,
    and supplementary material — regardless of whether they sit near the
    dataset's name in Step 1. A link/statement found anywhere in the paper
    still counts if it clearly refers to a cataloged dataset.

    Step 3 — Match each Step-1 dataset to any link/source found in Step 2.
    Do not invent references, names or links the paper doesn't provide.
    Always prioritize the retrieval link over a named source when both exist.

    For each dataset found, fill in:
    - name: the dataset's name.
    - source: the provider or organization named for it, or null if none is given.
    - link: the exact retrieval URL as printed in the paper, or null if none is given.
    - status: MENTIONED if a link is given, or if a source is named without a
      retrieval link; NOT_MENTIONED if neither a source nor a link is indicated.
    - verbatim: the exact sentence/clause containing the link (or, if no link,
      the source/reference). If multiple excerpts are found, and they are not sequential to each other, separate them with "...".
      If NOT_MENTIONED, return null.
  expected_output: >
    Return a json object with the following structured fields, no explanatory prose beyond the required short text fields.
    It must match this exact shape:
      {"datasets": [{"name": "Sentinel-2 imagery", "source": "ESA Copernicus", "link": "https://scihub.copernicus.eu/dhus/", "status": "MENTIONED", "verbatim": "Sentinel-2 imagery was downloaded from the ESA Copernicus Open Access Hub (https://scihub.copernicus.eu/dhus/)."}, {"name": "Field survey photos", "source": "Authors' own fieldwork", "link": null, "status": "NOT_MENTIONED", "verbatim": null}]}
  agent: paper_analyzer

check_method_reproducibility:
  description: >
    Step 1 — Anchor: read the abstract, introduction, and conclusion to
    identify the specific landslide mapping/detection method the authors
    present as their own contribution. This must appear as an entry
    regardless of classification, and takes priority over comparison methods.

    Step 2 — Catalog: scan the rest of the paper (methods, references,
    footnotes, figures, tables, appendices) for other methods USED TO MAP OR
    DETECT LANDSLIDES specifically — not preprocessing, visualization, data
    management, or accuracy-metric tools. Differentiate (a) the authors'
    own method(s), (b) methods used for evaluation/baseline mapping, (c)
    anything else merely mentioned. Report only (a) and (b); never drop (a)
    even if described briefly.

    Step 3 — Availability sweep: independently search the ENTIRE paper for
    code links and access statements — including "Code Availability"
    sections, footnotes, and supplementary material — regardless of whether
    they sit near the method's name in Steps 1–2. Match each found
    link/statement to the cataloged method it belongs to.

    Naming rules:
    - Use the method's exact name as stated (or combination of methods),
      never a generic category (e.g. 'deep learning').
    - A software/tool name (e.g. ArcGIS, PyTorch) is only a valid `name` if
      the software itself performed the mapping and no distinct
      algorithm/workflow name is given. If a distinct method name exists,
      the software is the source, not the name.
    - Do not invent references, names, or links the paper doesn't provide.
    - Always prioritize the retrieval link over a named source when both exist.

    Classify how each method is developed:
    1. CUSTOM_CODE — custom/algorithmic method; check for code.
    2. SOFTWARE — the mapping itself was carried out by a named tool (not an
       auxiliary task like preprocessing/visualization); no entry otherwise.
    3. REUSED — same as a prior publication; give the citation instead of
       re-describing.
    4. MANUAL — human interpretation, no code expected.

    For each method found, fill in:
      - name: the method's exact name as given in the paper (never a generic category).
      - method_type: one of CUSTOM_CODE, SOFTWARE, REUSED, MANUAL, per the
        classification rules above.
      - source: the origin named for it — the citation to the prior
        publication if REUSED, the software provider/vendor if SOFTWARE, the
        provider of the code/algorithm if CUSTOM_CODE — or null if none is
        given.
      - link: the exact retrieval URL for the method's implementation, or
        null if none is given. Prefer link over source whenever present.
      - status: MENTIONED if a link is given, or if a source is named without
        a retrieval link; NOT_MENTIONED if neither is indicated.
      - verbatim: the exact sentence/clause containing the link (or source)
        — taken from wherever it actually appears in the paper, not
        necessarily near the method's first mention. If NOT_MENTIONED,
        return null.
  expected_output: >
    Return a json object with the following structured fields, no explanatory prose beyond the required short text fields.
    It must match this exact shape:
      {"methods": [
        {"name": "U-Net with ResNet-34 encoder", "method_type": "CUSTOM_CODE", "source": null, "link": "https://github.com/example/repo", "status": "MENTIONED", "verbatim": "Our implementation of U-Net with a ResNet-34 encoder is available at https://github.com/example/repo."}
      ]}
  agent: paper_analyzer

check_artifact_availability:
  description: >
    Visit the following publication page and inspect it (and any linked
    data/code availability sections) to determine whether data and code
    artifacts are actually available, and capture any explicit author
    statements on availability and reproducibility.
    Data available upon request is considered NOT_MENTIONED.

    Publication URL:
    {doi_url}
  expected_output: >
    Return only the structured fields, no explanatory prose beyond the required short text fields. A summary including:
    - Access status of the publication page: ACCESSIBLE / NOT_ACCESSIBLE
    - Data availability status: MENTIONED / NOT_MENTIONED
    - data_links: one entry per dataset you can identify from the page (data
      availability section, repository links, supplementary material), each
      with its name/type, source/provider if named, the retrieval link, and
      a per-entry status of MENTIONED (with a link when provieded), or NOT_MENTIONED. Leave empty if none found.
    - Code availability status: MENTIONED / NOT_MENTIONED
    - code_links: one entry per code/software artifact you can identify from
      the page (code availability section, repository links), each with a
      short name/label, method_type (use CUSTOM_CODE if it's a repository of
      custom code, SOFTWARE if it's named existing software, REUSED if the
      page states the code is from a prior publication, otherwise your best
      judgment from what the page states), source (the citation/provider
      named, if any, or null), link (the exact retrieval URL, preferred over
      source whenever a URL is present, or null), status (MENTIONED, since
      it's listed), and verbatim (the excerpt where the link/statement was
      found). Leave empty if none found.
    - Any direct author statement on availability or reproducibility
    It must match this exact shape:
      {"access_status": "ACCESSIBLE", "data_status": "MENTIONED", "data_links": [{"name": "Sentinel-2 imagery", "source": "ESA Copernicus", "link": "https://scihub.copernicus.eu/dhus/", "status": "AVAILABLE"}], "code_status": "MENTIONED", "code_links": [{"name": "Landslide classification pipeline", "method_type": "CUSTOM_CODE", "source": null, "link": "https://github.com/example/repo", "status": "MENTIONED", "verbatim": "Code availability: the classification pipeline is available at https://github.com/example/repo."}], "author_statement": "Data and code are available upon reasonable request."}
  agent: availability_web_scraper


compile_final_report_from_consolidated:
  description: >
    Using the CONSOLIDATED dataset and method findings below,
    together with the artifact availability information
    below (already determined beforehand — do not re-check it), determine
    objectively:
    1. Whether the paper can be attempted to be reproduced overall.
    2. Whether datasets are provided, referenced, or linked.
    3. Whether any code used for the methods has a repository link,
       persistent link, or reference.
    Base your judgment only on what is given below; do not introduce new
    findings.
    If part of the datasets are referenced and linked but the inventory is not available, the datasets are not considered available.

    Consolidated datasets:
    {consolidated_datasets}

    Consolidated methods:
    {consolidated_methods}

    Artifact availability (pre-recorded from the publication webpage):
    {availability_summary}
  expected_output: >
    Return only a json object with two fields, "reproducibility_status" and
    "reproducibility_assessment", no explanatory prose.
    - "reproducibility_status": one of REPRODUCIBLE, PARTIALLY_REPRODUCIBLE,
      NOT_REPRODUCIBLE.
    - "reproducibility_assessment": a concise, objective one-or-two sentence
      statement (max ~50 words) covering, in order:
        - Dataset status: provided, referenced, or linked — or not.
        - Code status (only if custom code was used in a method): has a
          repository link, persistent link, or reference — or none.
      Do not repeat the verdict word here; state the supporting facts only.
    Shape only (placeholder, not real content, do not reuse it):
      {"reproducibility_status": "PARTIALLY_REPRODUCIBLE", "reproducibility_assessment": "<dataset status>. <code status if applicable>."}
  agent: report_elaborator
