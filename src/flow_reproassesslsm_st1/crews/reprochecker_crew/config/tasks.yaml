filter_landslide_mapping_paper:
  description: >
    Based only on the abstract provided below, determine whether this paper
    explores and documents a landslide detection/mapping method. A qualifying paper's
    abstract must indicate a methodology (or a reference
    to prior methodology) to detect/map landslides, a description of the datasets used, and a
    description of the results. Exclude papers that only describe landslide
    inventories, landslide susceptibility mapping methods, or that are
    review articles. Do not assume details the abstract doesn't state; if
    ambiguous, lean toward EXCLUDE and say why in the reason.

    Abstract:
    {abstract}
  expected_output: >
    Return only the structured fields, no explanatory prose beyond the required short text fields.
    A decision of either INCLUDE or EXCLUDE, followed by justification:
    - If INCLUDE: briefly state what mapping method is being used and with which datasets.
    - If EXCLUDE: state the reason, e.g. "landslide inventory only",
      "susceptibility mapping, not mapping method", "review article",
      or "missing methodology/dataset/results description".
    The output should be around 50 words.
  agent: abstract_screener

check_data_reproducibility:
  description: >
    Use your PDF search tool to identify all datasets used in the paper,
    including satellite imagery and landslide inventories. Search for data
    sources, dataset names, and any retrieval links or access statements.
    For each dataset, determine its source and whether the paper provides a
    direct link or clear indication of where to retrieve it.
  expected_output: >
    Return a json object with the following structured fields, no explanatory prose beyond the required short text fields:
    - Dataset name/type (e.g. satellite imagery, landslide inventory)
    - Source/provider, if indicated
    - Retrieval link or access statement, if provided in the paper
    - A flag: MENTIONED (link/source clearly given or source named but no retrieval link),
    or NOT_MENTIONED (no source or link indicated)
    It must match this exact shape:
      {"datasets": [{"name": "Sentinel-2 imagery", "source": "ESA Copernicus", "link": "https://scihub.copernicus.eu/dhus/", "status": "MENTIONED"}, {"name": "Field survey photos", "source": "Authors' own fieldwork", "link": null, "status": "NOT_MENTIONED"}]}

  agent: paper_analyzer

check_method_reproducibility:
  description: >
    Use your PDF search tool to identify every distinct landslide mapping
    method in the paper (there may be more than one, e.g. manual for one
    dataset, custom code for another). For each, check the methodology
    section, footnotes, and appendices for algorithm/software details and
    any code or repository references. Classify each as:
    1. MANUAL — human interpretation/visual inspection, no code expected.
    2. SOFTWARE — existing named software used as-is, no custom code expected.
    3. CUSTOM_CODE — custom/algorithmic method; search for accompanying code
       and report FOUND or NOT_FOUND.
    4. REUSED — identical to a prior publication; report the citation
       instead of re-describing it.
  expected_output: >
    Return a json object only, no extra prose. One entry per method found,
    matching this exact shape:
      {"methods": [{"name": "Manual photo-interpretation of orthophotos", "method_type": "MANUAL", "summary": "Landslides were manually digitized from post-event orthophotos by two expert interpreters.", "code_status": "N/A", "code_link": null, "reused_citation": null}, {"name": "Random forest classification on Sentinel-2", "method_type": "CUSTOM_CODE", "summary": "A random forest classifier was trained on spectral indices to detect landslide surfaces.", "code_status": "FOUND", "code_link": "https://github.com/example/repo", "reused_citation": null}]}
    If only one method is described, return an array with a single entry.
  agent: paper_analyzer

check_artifact_availability:
  description: >
    Visit the following publication page and inspect it (and any linked
    data/code availability sections) to determine whether data and code
    artifacts are actually available, and capture any explicit author
    statements on availability and reproducibility.
    Data available upon request is considered NOT_MENTIONED.

    Publication URL:
    {doi_url}
  expected_output: >
    Return only the structured fields, no explanatory prose beyond the required short text fields. A summary including:
    - Access status of the publication page: ACCESSIBLE / NOT_ACCESSIBLE
    - Data availability status: MENTIONED / NOT_MENTIONED
    - data_links: one entry per dataset you can identify from the page (data
      availability section, repository links, supplementary material), each
      with its name/type, source/provider if named, the retrieval link, and
      a per-entry status of MENTIONED (with a link when provieded), or NOT_MENTIONED. Leave empty if none found.
    - Code availability status: MENTIONED / NOT_MENTIONED
    - code_links: one entry per code/software artifact you can identify from
      the page (code availability section, repository links), each with a
      short name/label, method_type (use CUSTOM_CODE if it's a repository of
      custom code, SOFTWARE if it's named existing software, otherwise your
      best judgment from what the page states), a one-sentence summary of
      what the link/statement says, code_status (FOUND, since it's listed),
      the code_link, and reused_citation if the page states the code is from
      a prior publication. Leave empty if none found.
    - Any direct author statement on availability or reproducibility
    It must match this exact shape:
      {"access_status": "ACCESSIBLE", "data_status": "MENTIONED", "data_links": [{"name": "Sentinel-2 imagery", "source": "ESA Copernicus", "link": "https://scihub.copernicus.eu/dhus/", "status": "AVAILABLE"}], "code_status": "MENTIONED", "code_links": [{"name": "Landslide classification pipeline", "method_type": "CUSTOM_CODE", "summary": "Code availability section links to a GitHub repository with the classification pipeline.", "code_status": "FOUND", "code_link": "https://github.com/example/repo", "reused_citation": null}], "author_statement": "Data and code are available upon reasonable request."}
  agent: availability_web_scraper


compile_final_report:
  description: >
    Using the outputs from the data reproducibility check, method
    reproducibility check, and artifact availability check, form an
    overall qualitative judgment of whether the paper's data and methods
    are available to reproduce the study. Do not restate or summarize the datasets, methods,
    or availability findings — those are already recorded elsewhere and
    will be attached separately. Base your judgment only on what was
    already reported by the other checks; do not introduce new findings.
    - If the artifact availability access_status = NOT ACESSIBLE, the assessment should consider only the findings in
    Data Reproducibility Check and Method Reproducibility Check.
  expected_output: >
    Return only a json object with a single field, no explanatory prose,
    matching this exact shape:
      {"reproducibility_assessment": "Partially reproducible: datasets are named with retrieval links, but the custom classification code is not available and no repository is provided."}
    Maximum 150 words.
  agent: report_elaborator

compile_final_report_from_availability:
  description: >
    Using the outputs from the data reproducibility check and method
    reproducibility check, together with the artifact availability
    information below (already determined from the publication webpage
    beforehand — do not re-check it), form an overall qualitative
    judgment of whether the paper's data and methods are available to
    reproduce the study. Do not restate or summarize the datasets,
    methods, or availability findings — those are already recorded
    elsewhere and will be attached separately. Base your judgment only
    on what was already reported by the other checks and the
    availability information below; do not introduce new findings.
    - If the artifact availability access_status = NOT_ACCESSIBLE, the
    assessment should consider only the findings in Data Reproducibility
    Check and Method Reproducibility Check.

    Artifact availability (pre-recorded from the publication webpage):
    {availability_summary}
  expected_output: >
    Return only a json object with a single field, no explanatory prose,
    matching this exact shape:
      {"reproducibility_assessment": "Partially reproducible: datasets are named with retrieval links, but the custom classification code is not available and no repository is provided."}
    Maximum 150 words.
  agent: report_elaborator