filter_landslide_mapping_paper:
  description: >
    Based only on the abstract provided below, determine whether this paper
    explores and documents a landslide detection/mapping method. A qualifying paper's
    abstract must indicate a methodology (or a reference
    to prior methodology) to detect/map landslides, a description of the datasets used, and a
    description of the results. Exclude papers that only describe landslide
    inventories, landslide susceptibility mapping methods, or that are
    review articles. Do not assume details the abstract doesn't state; if
    ambiguous, lean toward EXCLUDE and say why in the reason.

    Abstract:
    {abstract}
  expected_output: >
    Return only the structured fields, no explanatory prose beyond the required short text fields.
    A decision of either INCLUDE or EXCLUDE, followed by justification:
    - If INCLUDE: briefly state what mapping method is being used and with which datasets.
    - If EXCLUDE: state the reason, e.g. "landslide inventory only",
      "susceptibility mapping, not mapping method", "review article",
      or "missing methodology/dataset/results description".
    The output should be around 50 words.
  agent: abstract_screener

check_data_reproducibility:
  description: >
    Use your PDF search tool to identify all datasets used in the paper,
    including satellite imagery and landslide inventories. Search for data
    sources, dataset names, and any retrieval links or access statements.
    For each dataset, determine its source and whether the paper provides a
    direct link or clear indication of where to retrieve it.
  expected_output: >
    Return a json object with the following structured fields, no explanatory prose beyond the required short text fields:
    - Dataset name/type (e.g. satellite imagery, landslide inventory)
    - Source/provider, if indicated
    - Retrieval link or access statement, if provided in the paper
    - A flag: MENTIONED (link/source clearly given or source named but no retrieval link),
    or NOT_MENTIONED (no source or link indicated)
    It must match this exact shape:
      {"datasets": [{"name": "Sentinel-2 imagery", "source": "ESA Copernicus", "link": "https://scihub.copernicus.eu/dhus/", "status": "MENTIONED"}, {"name": "Field survey photos", "source": "Authors' own fieldwork", "link": null, "status": "NOT_MENTIONED"}]}

  agent: paper_analyzer

check_method_reproducibility:
  description: >
    Find every distinct landslide mapping method in the paper using your
    PDF search tool. Check methodology, footnotes, figures, tables, and
    appendices.

    ALWAYS use the exact name from the paper, never a generic category:
    - "U-Net", "ResNet-50", "Mask R-CNN" — NOT "CNN" or "deep learning model"
    - "Random Forest", "XGBoost", "SVM" — NOT "machine learning"
    - "logistic regression", "frequency ratio" — NOT "statistical method"
    Check figure captions and tables too — architecture names often only
    appear there. Only use a generic name if the paper never states a
    specific one anywhere.

    Classify each method:
    1. MANUAL — human interpretation, no code expected.
    2. SOFTWARE — named existing software, no custom code expected.
    3. CUSTOM_CODE — custom/algorithmic method; check for code, report
       MENTIONED or NOT_MENTIONED.
    4. REUSED — same as a prior publication; give the citation instead of
       re-describing.

    Each architecture/algorithm is its own entry, even if compared in the
    same paper.
  expected_output: >
    Return a json object with the following structured fields, no explanatory prose beyond the required short text fields:
      {"methods": [
        {"name": "U-Net with ResNet-34 encoder", "method_type": "CUSTOM_CODE", "summary": "One-sentence summary.", "code_status": "MENTIONED", "code_link": "https://github.com/example/repo", "reused_citation": null}
      ]}
  agent: paper_analyzer

check_artifact_availability:
  description: >
    Visit the following publication page and inspect it (and any linked
    data/code availability sections) to determine whether data and code
    artifacts are actually available, and capture any explicit author
    statements on availability and reproducibility.
    Data available upon request is considered NOT_MENTIONED.

    Publication URL:
    {doi_url}
  expected_output: >
    Return only the structured fields, no explanatory prose beyond the required short text fields. A summary including:
    - Access status of the publication page: ACCESSIBLE / NOT_ACCESSIBLE
    - Data availability status: MENTIONED / NOT_MENTIONED
    - data_links: one entry per dataset you can identify from the page (data
      availability section, repository links, supplementary material), each
      with its name/type, source/provider if named, the retrieval link, and
      a per-entry status of MENTIONED (with a link when provieded), or NOT_MENTIONED. Leave empty if none found.
    - Code availability status: MENTIONED / NOT_MENTIONED
    - code_links: one entry per code/software artifact you can identify from
      the page (code availability section, repository links), each with a
      short name/label, method_type (use CUSTOM_CODE if it's a repository of
      custom code, SOFTWARE if it's named existing software, otherwise your
      best judgment from what the page states), a one-sentence summary of
      what the link/statement says, code_status (MENTIONED, since it's listed),
      the code_link, and reused_citation if the page states the code is from
      a prior publication. Leave empty if none found.
    - Any direct author statement on availability or reproducibility
    It must match this exact shape:
      {"access_status": "ACCESSIBLE", "data_status": "MENTIONED", "data_links": [{"name": "Sentinel-2 imagery", "source": "ESA Copernicus", "link": "https://scihub.copernicus.eu/dhus/", "status": "AVAILABLE"}], "code_status": "MENTIONED", "code_links": [{"name": "Landslide classification pipeline", "method_type": "CUSTOM_CODE", "summary": "Code availability section links to a GitHub repository with the classification pipeline.", "code_status": "MENTIONED", "code_link": "https://github.com/example/repo", "reused_citation": null}], "author_statement": "Data and code are available upon reasonable request."}
  agent: availability_web_scraper


verify_reproducibility_entries:
  description: >
    Using your PDF tool, re-check the datasets and methods identified by
    the data reproducibility check and method reproducibility check (given
    as context above) against the original publication.

    For each dataset and method entry given to you:
    1. Confirm it is genuinely related to landslide mapping — not a
       generic or unrelated dataset/method mistakenly included.
    2. If a link/reference is given, confirm that link/reference is
       actually the one associated with that dataset/method in the paper
       (not a mismatched or unrelated link).
    3. Set relevance_status to CONFIRMED only if both checks above pass;
       otherwise REJECTED. Explain your finding in relevance_reason.
    4. Quote a short excerpt (a sentence or fragment) from the publication
       where the dataset/method and its reference/link appear, as
       source_excerpt.

    Do not drop, add, or otherwise alter any of the original entries
    beyond adding the three verification fields.
  expected_output: >
    Return a json object with the following structured fields, no explanatory prose beyond the required short text fields:
    - datasets: the input dataset list, each entry with relevance_status,
      relevance_reason, and source_excerpt added.
    - methods: the input method list, each entry with relevance_status,
      relevance_reason, and source_excerpt added.
    It must match this exact shape:
      {"datasets": [{"name": "Sentinel-2 imagery", "source": "ESA Copernicus", "link": "https://scihub.copernicus.eu/dhus/", "status": "MENTIONED", "relevance_status": "CONFIRMED", "relevance_reason": "Used as the primary imagery source for landslide detection.", "source_excerpt": "We used Sentinel-2 Level-2A imagery from ESA Copernicus (scihub.copernicus.eu/dhus/) as input to the classifier."}], "methods": [{"name": "U-Net with ResNet-34 encoder", "method_type": "CUSTOM_CODE", "summary": "One-sentence summary.", "code_status": "MENTIONED", "code_link": "https://github.com/example/repo", "reused_citation": null, "relevance_status": "CONFIRMED", "relevance_reason": "Custom U-Net trained specifically for landslide segmentation; code link matches the repo mentioned in the paper.", "source_excerpt": "Our implementation, based on U-Net with a ResNet-34 encoder, is available at https://github.com/example/repo."}]}
  agent: paper_reviewer

compile_final_report:
  description: >
    Using the outputs from the report verification check and artifact
    availability check (given as context above), determine objectively:
    1. Whether the paper can be attempted to be reproduced overall.
    2. Whether datasets are provided, referenced, or linked.
    3. Whether any code used for the methods has a repository link,
       persistent link, or reference.
    Base your judgment only on what was already reported by the other
    checks; do not introduce new findings. Disregard any dataset or method
    entry whose relevance_status is REJECTED.
    - If the artifact availability access_status = NOT_ACCESSIBLE, base
    the judgment only on the report verification check.
  expected_output: >
    Return only a json object with a single field "reproducibility_assessment",
    no explanatory prose. Its value is a concise, objective statement covering,
    in order:
    - Overall verdict: Reproducible / Partially reproducible / Not reproducible.
    - Dataset status: provided, referenced, or linked — or not.
    - Code status (only if custom code was used in a method): has a
      repository link, persistent link, or reference — or none.
    Shape only (placeholder, not real content, do not reuse it):
      {"reproducibility_assessment": "<verdict>. <dataset status>. <code status if applicable>."}
  agent: report_elaborator

compile_final_report_from_availability:
  description: >
    Using the output from the report verification check (given as context
    above), together with the artifact availability information below
    (already determined from the publication webpage beforehand — do not
    re-check it), determine objectively:
    1. Whether the paper can be attempted to be reproduced overall.
    2. Whether datasets are provided, referenced, or linked.
    3. Whether any code used for the methods has a repository link,
       persistent link, or reference.
    Base your judgment only on what was already reported by the report
    verification check and the availability information below; do not
    introduce new findings. Disregard any dataset or method entry whose
    relevance_status is REJECTED.

    Artifact availability (pre-recorded from the publication webpage):
    {availability_summary}
  expected_output: >
    Return only a json object with two fields, "reproducibility_status" and
    "reproducibility_assessment", no explanatory prose.
    - "reproducibility_status": one of REPRODUCIBLE, PARTIALLY_REPRODUCIBLE,
      NOT_REPRODUCIBLE.
    - "reproducibility_assessment": a concise, objective one-or-two sentence
      statement (max ~50 words) covering, in order:
        - Dataset status: provided, referenced, or linked — or not.
        - Code status (only if custom code was used in a method): has a
          repository link, persistent link, or reference — or none.
      Do not repeat the verdict word here; state the supporting facts only.
    Shape only (placeholder, not real content, do not reuse it):
      {"reproducibility_status": "PARTIALLY_REPRODUCIBLE", "reproducibility_assessment": "<dataset status>. <code status if applicable>."}
  agent: report_elaborator